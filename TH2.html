<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TH2 - Máy tính đơn giản</title>
  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #eef2f5;
    }
    .may-tinh {
      width: 300px;
      margin: auto;
      padding: 20px;
      background: #263238;
      border-radius: 10px;
      box-shadow: 0 3px 8px #999;
    }
    h1 {
      color: white;
      text-align: center;
      font-size: 24px;
    }
    #manHinh {
      overflow: hidden;
      height: 55px;
      margin-bottom: 15px;
      padding: 10px;
      color: #222;
      background: white;
      border-radius: 5px;
      font-size: 28px;
      text-align: right;
    }
    .cac-nut {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      padding: 14px 5px;
      border: 0;
      border-radius: 5px;
      background: #eceff1;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #cfd8dc; }
    .phep-tinh { background: #ffb74d; }
    .xoa { background: #ef5350; color: white; }
    .bang { background: #66bb6a; color: white; }
  </style>
</head>
<body>
  <div class="may-tinh">
    <h1>Máy tính đơn giản</h1>
    <div id="manHinh">0</div>

    <div class="cac-nut">
      <button class="xoa">Clear</button>
      <button class="phep-tinh">/</button>
      <button class="phep-tinh">*</button>
      <button class="phep-tinh">-</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="phep-tinh">+</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>0</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="bang">=</button>
    </div>
  </div>

  <script>
    var manHinh = document.getElementById("manHinh");
    var cacNut = document.querySelectorAll("button");

    cacNut.forEach(function (nut) {
      nut.addEventListener("click", function () {
        var giaTri = nut.innerText;

        if (giaTri == "Clear") {
          manHinh.innerText = "0";
        } else if (giaTri == "=") {
          if (manHinh.innerText != "0" && manHinh.innerText != "") {
            try {
              manHinh.innerText = eval(manHinh.innerText);
            } catch (loi) {
              manHinh.innerText = "Lỗi";
            }
          }
        } else {
          if (manHinh.innerText == "0" &&
              (giaTri == "+" || giaTri == "-" || giaTri == "*" || giaTri == "/")) {
            return;
          }
          if (manHinh.innerText == "0" || manHinh.innerText == "Lỗi") {
            manHinh.innerText = giaTri;
          } else {
            manHinh.innerText += giaTri;
          }
        }
      });
    });
  </script>
</body>
</html>
