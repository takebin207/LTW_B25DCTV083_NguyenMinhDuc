<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TH1 - Trang giới thiệu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background: #f2f5f8;
    }
    header, footer {
      padding: 20px;
      text-align: center;
      color: white;
      background: #2563a6;
    }
    nav {
      padding: 12px;
      text-align: center;
      background: #174a7c;
    }
    nav a {
      margin: 0 12px;
      color: white;
      text-decoration: none;
    }
    main {
      width: 90%;
      max-width: 800px;
      margin: 25px auto;
    }
    section {
      margin-bottom: 18px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px #ccc;
    }
    button {
      padding: 10px 16px;
      color: white;
      background: #e67e22;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    footer { margin-top: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>Trang giới thiệu cá nhân</h1>
    <p id="loiChao"></p>
  </header>

  <nav>
    <a href="#gioiThieu">Giới thiệu</a>
    <a href="#soThich">Sở thích</a>
    <a href="#lienHe">Liên hệ</a>
  </nav>

  <main>
    <section id="gioiThieu">
      <h2>Giới thiệu</h2>
      <p>Xin chào, mình là Nguyễn Minh Đức, sinh viên ngành AIoT.</p>
      <p>Mình đang học HTML, CSS và JavaScript.</p>
    </section>

    <section id="soThich">
      <h2>Sở thích</h2>
      <p>Nghe nhạc, xem phim và tìm hiểu về công nghệ.</p>
      <button id="doiMau">Đổi màu nền</button>
    </section>

    <section id="lienHe">
      <h2>Liên hệ</h2>
      <p>Email: nguyenvanduc@example.com</p>
    </section>
  </main>

  <footer>
    <p>© 2026 - Trang giới thiệu cá nhân</p>
  </footer>

  <script>
    var loiChao = document.getElementById("loiChao");
    var gio = new Date().getHours();

    if (gio < 12) {
      loiChao.innerText = "Chào buổi sáng! Chúc bạn một ngày vui vẻ.";
    } else if (gio < 18) {
      loiChao.innerText = "Chào buổi chiều! Chúc bạn học tập tốt.";
    } else {
      loiChao.innerText = "Chào buổi tối! Cảm ơn bạn đã ghé thăm.";
    }

    var mauMoi = ["#f2f5f8", "#fff3cd", "#dff6ff", "#e8f5e9"];
    var viTri = 0;

    document.getElementById("doiMau").addEventListener("click", function () {
      viTri = (viTri + 1) % mauMoi.length;
      document.body.style.backgroundColor = mauMoi[viTri];
    });
  </script>
</body>
</html>
